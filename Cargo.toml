[package]
name = "iris-tray"
version = "1.1.3"
edition = "2021"
rust-version = "1.78"
authors = ["HDHR"]
description = "Lightweight Windows System Tray battery monitor for Press Play IRIS v2 NearLink gaming mouse"
license = "MIT"
repository = "https://github.com/HDHR/IrisTray"
keywords = ["nearlink", "mouse", "battery", "tray", "gaming"]

[dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_Networking_WinHttp",
]

[[bin]]
name = "IrisTray"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
